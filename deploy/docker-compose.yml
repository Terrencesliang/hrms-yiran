name: hrms-yiran

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_ROOT_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_ROOT_USERNAME:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    image: frappe/bench:latest
    restart: unless-stopped
    working_dir: /home/frappe
    command: bash /workspace/deploy/init.sh
    environment:
      DB_PASSWORD: ${DB_PASSWORD}
      DB_ROOT_USERNAME: ${DB_ROOT_USERNAME:-postgres}
      DB_HOST: postgres
      DB_PORT: ${DB_PORT:-5432}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      SITE_NAME: ${SITE_NAME:-hrms.localhost}
      FRAPPE_BRANCH: ${FRAPPE_BRANCH:-develop}
      ERPNEXT_BRANCH: ${ERPNEXT_BRANCH:-develop}
      LANGUAGE: ${LANGUAGE:-zh}
      HTTP_PORT: ${HTTP_PORT:-8080}
      SHELL: /bin/bash
    volumes:
      - ..:/workspace/source:ro
      - ./init.sh:/workspace/deploy/init.sh:ro
      - bench-data:/home/frappe/frappe-bench
    ports:
      - "${HTTP_PORT:-8080}:8000"
      - "${SOCKETIO_PORT:-9000}:9000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres-data:
  bench-data:
